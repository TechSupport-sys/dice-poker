<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dice Poker — Scorecard</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎲</span>
      <h1 data-i18n="brand">Dice Poker</h1>
    </div>
    <div class="top-right">
      <select id="langSelect" class="lang-select" aria-label="Language"></select>
      <div class="status" id="status"></div>
    </div>
  </header>

  <section class="panel" id="setup">
    <h2 data-i18n="setupTitle">New game</h2>
    <label class="field"><span data-i18n="playersLabel">Players</span>
      <select id="playerCount"></select>
    </label>
    <label class="field inline"><span data-i18n="diceModeLabel">Virtual dice</span>
      <input type="checkbox" id="diceMode" checked>
    </label>
    <div id="nameFields" class="name-grid"></div>
    <div class="btns">
      <button class="primary" id="createBtn" data-i18n="createBtn">Create game</button>
    </div>
    <p class="hint" data-i18n="hint">Play → screenshot. Scores are not saved.</p>
  </section>

  <section class="panel hidden" id="game">
    <div class="panel-head">
      <div class="title-block">
        <h2 id="gameTitle">Game</h2>
        <div class="leaderboard" id="leaderboard"></div>
      </div>
      <div class="actions">
        <button class="ghost small" id="undoBtn" disabled data-i18n="undoBtn">↩ Undo</button>
        <button class="ghost small" id="newGameBtn" data-i18n="newGameBtn">New</button>
      </div>
    </div>
    <div id="playerTabs" class="player-tabs hidden"></div>
    <div class="dice-stage" id="diceStage">
      <div class="dice-tray" id="diceTray"></div>
      <div class="dice-meta" id="diceMeta">
        <span class="roll-count" id="rollCount"></span>
        <span class="held-hint" id="heldHint" data-i18n="heldHint">Tap dice to hold</span>
      </div>
      <div class="roll-actions">
        <button class="primary roll-btn" id="rollBtn" data-i18n="rollBtn">🎲 Roll dice</button>
        <button class="ghost" id="shakeBtn" data-i18n="shakeBtn">📳 Shake to roll</button>
      </div>
    <div class="manual-dice hidden" id="manualDice">
      <div class="manual-row" id="manualRow">
        <input type="number" min="1" max="6" value="1" class="manual-die" data-idx="0">
        <input type="number" min="1" max="6" value="1" class="manual-die" data-idx="1">
        <input type="number" min="1" max="6" value="1" class="manual-die" data-idx="2">
        <input type="number" min="1" max="6" value="1" class="manual-die" data-idx="3">
        <input type="number" min="1" max="6" value="1" class="manual-die" data-idx="4">
      </div>
      <button class="primary" id="manualSuggestBtn" data-i18n="manualSuggestBtn">Get suggestions</button>
    </div>
      <div class="roll-result hidden" id="rollResult">
        <div class="result-dice" id="resultDice"></div>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>
    <div class="table-wrap"><table id="scoreTable"></table></div>
    <details class="rules">
      <summary data-i18n="rulesSummary">How to score combinations</summary>
      <ul id="rulesList"></ul>
    </details>
    <div class="game-over hidden" id="gameOver" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
      <div class="game-over-card">
        <div class="winner-trophy" aria-hidden="true">🏆</div>
        <h2 id="gameOverTitle" data-i18n="gameOverTitle">Game over!</h2>
        <p id="gameOverMessage"></p>
        <button class="primary" id="gameOverClose" data-i18n="gameOverClose">Close</button>
      </div>
    </div>
  </section>

  <footer class="foot">
    <span id="netInfo"></span>
  </footer>
</div>

<script src="./score.js?v=29"></script>
</body>
</html>
